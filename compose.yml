services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowpulse
      POSTGRES_USER: flowpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: backend
    command: node api/server.mjs
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://flowpulse:${POSTGRES_PASSWORD}@postgres/flowpulse
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      target: backend
    command: node api/collector.mjs
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://flowpulse:${POSTGRES_PASSWORD}@postgres/flowpulse
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
